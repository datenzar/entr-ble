[project]
name = "entr-ble-cli"
version = "1.1.0"
description = "Command-line interface for ENTR Bluetooth locks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "entr-ble==1.1.0",
]

[project.urls]
Repository = "https://github.com/johannlejeune/entr-ble"
Issues = "https://github.com/johannlejeune/entr-ble/issues"

[project.scripts]
entr-ble-cli = "entr_ble_cli:main"

[tool.uv.sources]
entr-ble = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

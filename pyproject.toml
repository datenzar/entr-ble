[project]
name = "entr-ble"
version = "1.1.0"
description = "Python client for ENTR Bluetooth locks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Johann Lejeune", email = "tofupedia.fr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bleak>=3.0.2",
    "cryptography>=48.0.1",
]

[project.urls]
Repository = "https://github.com/johannlejeune/entr-ble"
Issues = "https://github.com/johannlejeune/entr-ble/issues"

[tool.ruff.lint.per-file-ignores]
"src/entr_ble/client/*.py" = ["PLR0402"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "packages/entr-ble-cli/src", "custom_components", "tests", "packages/entr-ble-cli/tests"]
extraPaths = ["src", "packages/entr-ble-cli/src", "."]

[tool.uv.workspace]
members = ["packages/entr-ble-cli"]

[tool.uv.dependency-groups]
hacs = { requires-python = ">=3.14.2" }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "ruff>=0.16.9",
]
hacs = [
    "homeassistant==2026.9.4",
]
